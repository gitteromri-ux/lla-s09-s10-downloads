name: Julie V15 fetch + chunk

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Fetch from Drive
        run: |
          set -e
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip3 install --quiet gdown
          gdown --fuzzy "https://drive.google.com/uc?id=1aAHLQ70jzJIne7miLERBcHi5vwqEIvK3" -O FRONT.mp4
          gdown --fuzzy "https://drive.google.com/uc?id=1g-mKR1qAwvlCHVpwvPIoEMgbS-rPrxEn" -O SPORT2.mp4
          gdown --fuzzy "https://drive.google.com/uc?id=1H2xbKCwHbVKdQUV5nVeY5-Rd1KFaxqkN" -O LONGEVITY1.mp4
          ls -la FRONT.mp4 SPORT2.mp4 LONGEVITY1.mp4
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 FRONT.mp4
      - name: Process
        run: |
          set -e
          mkdir -p out
          ffmpeg -y -loglevel error -i FRONT.mp4 -vn -ac 1 -ar 16000 -c:a aac -b:a 96k out/front_audio_16k.m4a
          ffmpeg -y -loglevel error -ss 15 -to 42 -i LONGEVITY1.mp4 -c:v libx264 -preset fast -crf 18 -an out/longevity_15_42.mp4
          ffmpeg -y -loglevel error -i SPORT2.mp4 -vf "scale=1920:-2" -r 30 -c:v libx264 -preset fast -crf 19 -an out/sport2_1080.mp4
          split -b 55M -d FRONT.mp4 out/front_chunk_
          ls -la out/
      - name: Upload release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG=julie-v15-src
          gh release delete "$TAG" -y --cleanup-tag || true
          gh release create "$TAG" -t "Julie V15 sources" -n "Auto-generated source bundle for Julie V15 rebuild" out/*
