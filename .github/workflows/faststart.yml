name: faststart-remux
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download julie-v23-final --repo ${{ github.repository }} -p 'JULIE_LLA_V23_*.mp4' -D in
          ls -la in
      - name: Remux faststart (lossless, no re-encode)
        run: |
          mkdir -p out
          for f in in/*.mp4; do
            b=$(basename "$f")
            ffmpeg -v error -y -i "$f" -c copy -movflags +faststart "out/$b"
            ffprobe -v error -show_entries format=duration -of csv=p=0 "out/$b"
          done
          ls -la out
      - name: Upload back to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload julie-v23-final out/*.mp4 --repo ${{ github.repository }} --clobber
      - name: Verify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf ver && gh release download julie-v23-final --repo ${{ github.repository }} -p 'JULIE_LLA_V23_*.mp4' -D ver
          for f in ver/*.mp4; do python3 - "$f" <<'PY'
import sys
d=open(sys.argv[1],'rb').read(400000)
m=d.find(b'moov'); a=d.find(b'mdat')
print(sys.argv[1],'moov',m,'mdat',a,'FASTSTART' if 0<m<a else 'FAIL')
assert 0<m<a, 'faststart failed'
PY
          done
