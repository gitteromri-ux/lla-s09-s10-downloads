name: faststart-remux
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/faststart.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: gh release download julie-v23-final --repo ${{ github.repository }} -p 'JULIE_LLA_V23_*.mp4' -D in && ls -la in
      - run: |
          mkdir -p out
          for f in in/*.mp4; do ffmpeg -v error -y -i "$f" -c copy -movflags +faststart "out/$(basename $f)"; done
          ls -la out
      - run: gh release upload julie-v23-final out/JULIE_LLA_V23_FULL.mp4 out/JULIE_LLA_V23_90S.mp4 --repo ${{ github.repository }} --clobber
      - run: |
          gh release download julie-v23-final --repo ${{ github.repository }} -p 'JULIE_LLA_V23_*.mp4' -D ver
          for f in ver/*.mp4; do
            python3 -c "import sys;d=open(sys.argv[1],'rb').read(400000);m=d.find(b'moov');a=d.find(b'mdat');print(sys.argv[1],m,a,'FASTSTART_OK' if 0<m<a else 'FAIL');sys.exit(0 if 0<m<a else 1)" "$f"
          done
